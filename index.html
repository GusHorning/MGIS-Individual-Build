<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tune N' Teach</title>
  <link rel="stylesheet" href="3_styles/style.css" />
</head>
<body>
  <header class="top-bar">
    <button id="home-btn" class="nav-btn hidden" type="button">← Home</button>
    <h1 id="page-title">Tune N' Teach</h1>
  </header>

  <main id="app-container">
    <!-- HOME VIEW -->
    <section id="view-home" class="view active">
      <p class="subtitle">Choose your instrument or jump into your lessons.</p>
      <div class="card-grid">
        <button class="choice-card" data-target="tuner" data-guitar="Acoustic Guitar" type="button">
          <img
            src="4_images/chris-hardy-VY0XY_DNwqc-unsplash.jpg"
            alt="Acoustic Guitar"
          />
          <div class="card-label">Acoustic Guitar</div>
        </button>

        <button class="choice-card" data-target="tuner" data-guitar="Electric Guitar" type="button">
          <img
            src="4_images/krzysztof-hepner-ZIGI-0Br8Bg-unsplash.jpg"
            alt="Electric Guitar"
          />
          <div class="card-label">Electric Guitar</div>
        </button>

        <button class="choice-card lessons-card" data-target="lessons" type="button">
          <div class="lessons-icon">▶</div>
          <div class="card-label">Song Lessons</div>
          <p class="card-hint">Saved YouTube tutorials & progress</p>
        </button>
      </div>
    </section>

    <!-- TUNER VIEW (Guitar Body Style) -->
    <section id="view-tuner" class="view">
      <div class="tuner-controls">
        <label for="preset-select">Tuning:</label>
        <select id="preset-select"></select>
        <button id="mic-toggle-btn" class="primary-btn" type="button">Start Mic</button>
      </div>

      <div id="status-text" class="status-text">Tap Start Mic to auto-detect, or tap a note below to hear it</div>

      <!-- Guitar Body Container -->
      <div id="guitar-body-frame" class="guitar-body acoustic">
        <!-- Traditional Dreadnought Acoustic Guitar Body Outline -->
        <svg class="body-svg acoustic-svg" viewBox="0 0 500 540" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 198,10 L 302,10 C 318,22 396,38 418,104 C 434,152 406,196 392,226 C 380,252 386,272 426,314 C 474,366 478,468 408,510 C 356,536 144,536 92,510 C 22,468 26,366 74,314 C 114,272 120,252 108,226 C 94,196 66,152 82,104 C 104,38 182,22 198,10 Z" />
        </svg>

        <!-- Fender Stratocaster Electric Guitar Body Outline -->
        <svg class="body-svg electric-svg" viewBox="0 0 500 540" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 208,10 L 292,10 L 292,98 C 304,104 316,96 326,80 C 338,60 356,56 368,68 C 382,82 374,124 358,158 C 344,188 346,218 378,256 C 422,308 446,388 412,456 C 384,510 318,530 250,524 C 218,522 196,532 162,530 C 104,526 56,478 52,414 C 48,348 86,296 122,250 C 148,216 148,180 128,136 C 104,84 96,34 118,24 C 138,16 158,48 176,82 C 186,100 198,104 208,98 Z" />
        </svg>

        <!-- Top Target Note Zone -->
        <div class="target-zone">
          <div class="center-guide"></div>
          <div id="tuning-circle" class="tuning-circle">
            <span id="target-note-display">--</span>
          </div>
        </div>

        <div class="meter-labels">
          <span>♭ Flat</span>
          <span class="freq-readout"><strong id="detected-freq">--</strong> / <span id="target-freq">--</span> Hz</span>
          <span>♯ Sharp</span>
        </div>

        <!-- Bottom 6 Note Circles -->
        <div id="string-buttons" class="string-row"></div>
      </div>
    </section>

    <!-- LESSONS VIEW -->
    <section id="view-lessons" class="view">
      <form id="lesson-form" class="lesson-form">
        <input id="lesson-title" type="text" placeholder="Song Title (e.g., Blackbird)" required />
        <input id="lesson-url" type="url" placeholder="YouTube URL (https://...)" required />
        <select id="lesson-status">
          <option value="learning">Actively Learning</option>
          <option value="known">Songs I Know</option>
        </select>
        <button class="primary-btn" type="submit">Add Lesson</button>
      </form>

      <div class="lessons-columns">
        <div class="lesson-bucket">
          <h2>Actively Learning</h2>
          <ul id="list-learning" class="lesson-list"></ul>
        </div>
        <div class="lesson-bucket">
          <h2>Songs I Know</h2>
          <ul id="list-known" class="lesson-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts loaded in numbered order -->
  <script src="2_scripts/1_data.js"></script>
  <script src="2_scripts/2_rules.js"></script>
  <script src="2_scripts/3_display.js"></script>
  <script src="2_scripts/4_start.js"></script>
</body>
</html>
